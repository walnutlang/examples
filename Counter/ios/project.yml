# Generated by `walnut new`. Regenerate with: xcodegen -s ios/project.yml
name: Counter
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  Walnut:
    path: __WALNUT_RUNTIME__
targets:
  Counter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Generated
        includes:
          - "*.o"
        buildPhase: none
      - path: Generated
        includes:
          - "*.json"
        buildPhase: resources
    dependencies:
      - package: Walnut
        product: WalnutUIKit
      - package: Walnut
        product: WalnutRT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.walnut.counter
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/Generated/Main.o"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Counter
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
