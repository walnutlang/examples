# Generated by `walnut new`. Regenerate with: xcodegen -s ios/project.yml
name: Lumen
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  Walnut:
    path: __WALNUT_RUNTIME__
targets:
  Lumen:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Generated
        includes:
          - "*.o"
        buildPhase: none
      - path: Generated
        includes:
          - "*.json"
        buildPhase: resources
    dependencies:
      - package: Walnut
        product: WalnutUIKit
      - package: Walnut
        product: WalnutRT
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.walnut.lumen
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/Generated/Main.o"
        CODE_SIGN_ENTITLEMENTS: Lumen.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Lumen reads steps, heart rate, blood pressure, glucose, and weight to power Feedback insights. Data stays on your device unless you choose another source.
        NSHealthUpdateUsageDescription: Lumen may save vitals you enter manually so they appear alongside HealthKit samples.
        NSSiriUsageDescription: Lumen uses Siri to log food, activity, and glucose from your voice.
        CFBundleURLTypes:
          - CFBundleURLName: dev.walnut.lumen
            CFBundleURLSchemes:
              - walnut-lumen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
