# Generated by `walnut new`. Regenerate with: xcodegen -s ios/project.yml
name: Todo
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  Walnut:
    path: __WALNUT_RUNTIME__
targets:
  Todo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated
        includes:
          - "*.json"
        buildPhase: resources
    dependencies:
      - package: Walnut
        product: WalnutUIKit
      - package: Walnut
        product: WalnutRT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.walnut.todo
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/Generated/Main.o"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Todo
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.walnut.todo
            CFBundleURLSchemes:
              - walnut-todo
