# EmbedPlay — MLX embeddings demo (device / Apple Silicon).
# Regenerate Xcode project: xcodegen -s ios/project.yml
name: EmbedPlay
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Walnut:
    path: __WALNUT_RUNTIME__
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 2.30.6
targets:
  EmbedPlay:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated
        includes:
          - "*.json"
        buildPhase: resources
    dependencies:
      - package: Walnut
        product: WalnutUIKit
      - package: Walnut
        product: WalnutRT
      - package: mlx-swift-lm
        product: MLXEmbedders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.walnut.embedplay
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "$(inherited) $(SRCROOT)/Generated/Main.o"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: EmbedPlay
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
